# Copier Template Configuration
_min_copier_version: "9.0"

project_name: "my-ai-project"
project_type: "python"
audit_level: "standard"
enable_deepeval: false
agent_mode: "shadow"

# Exclude scaffold-specific files that should not be copied
# (they exist only in the scaffold for reference)
_exclude:
  - "AGENTS.md"
  - "BACKGROUND.md"
  - "README.md"

_tasks:
  - "rm -rf scripts/"
  - "rm -rf knowledge/"
  - "rm -rf .beads/"
  - "rm -rf tests/"
  - "rm -rf templates/"
  - "rm -f LICENSE"
  - "rm -f copier.yml"
  - "rm -rf .pytest_cache/"
  # Rename common-* to final names
  - "mv common-agents.md AGENTS.md 2>/dev/null || true"
  - "mv common-readme.md README.md 2>/dev/null || true"
  # Remove .jinja template files
  - "rm -f common-agents.md.jinja"
  - "rm -f common-readme.md.jinja"
