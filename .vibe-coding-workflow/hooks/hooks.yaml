# Hooks Configuration
# This file defines which hooks are enabled and their settings
# for the git commit workflow.

# Git hooks configuration
git:
  # Enabled git hooks
  enabled:
    - pre-commit
    - commit-msg
  
  # Hook execution order (first to last)
  pre_commit:
    - guardian
    - audit
  
  commit_msg:
    - conventional_commit

# Individual hook configurations
hooks:
  # Security scanner
  guardian:
    enabled: true
    level: security  # security | full
    project_type: python  # python | typescript | go | rust | auto
    timeout: 60
  
  # Code review agent
  audit:
    enabled: true
    mode: shadow  # shadow | full
    level: standard  # lax | standard | strict
    timeout: 120
    # Files to exclude from audit
    exclude:
      - "*.test.py"
      - "**/test_*.py"
      - "**/tests/**"
  
  # Conventional commit validator
  conventional_commit:
    enabled: false
    types:
      - feat
      - fix
      - docs
      - style
      - refactor
      - perf
      - test
      - build
      - ci
      - chore
      - revert

# Global settings
settings:
  # Fail on first blocking issue or continue running
  fail_fast: true
  
  # Show all results even if blocking issues found
  show_all_results: false
  
  # Color output
  color: true
  
  # Quiet mode (only show errors)
  quiet: false
