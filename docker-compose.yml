services:
  opencode-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    container_name: ai-coding-scaffold-sandbox
    env_file:
      - .env.docker
    environment:
      - CI=${CI:-true}
      - DEBIAN_FRONTEND=${DEBIAN_FRONTEND:-noninteractive}
      - GIT_TERMINAL_PROMPT=${GIT_TERMINAL_PROMPT:-0}
      - PIP_NO_INPUT=${PIP_NO_INPUT:-1}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: tail -f /dev/null
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.5"
        reservations:
          memory: 512m
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "test", "-d", "/workspace"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
